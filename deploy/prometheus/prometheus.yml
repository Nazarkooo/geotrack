# Both tiers scale horizontally, so targets are resolved from Docker's embedded DNS:
# a compose service name returns one A record per running container, and new replicas
# are picked up within refresh_interval without editing this file.
global:
  scrape_interval: 5s
  scrape_timeout: 4s
  external_labels:
    stack: geotrack

scrape_configs:
  - job_name: api
    metrics_path: /metrics
    dns_sd_configs:
      - names: [api]
        type: A
        port: 8000
        refresh_interval: 10s

  - job_name: processor
    metrics_path: /metrics
    dns_sd_configs:
      - names: [processor]
        type: A
        port: 9100
        refresh_interval: 10s

  - job_name: prometheus
    static_configs:
      - targets: [127.0.0.1:9090]
