# Edge proxy: serves the dashboard, fans REST and websocket traffic out over the API
# replicas, and is the only container with a published port.

# Pinned, not `auto`. nginx reads the host's core count rather than the cgroup quota, so
# on a 15-core machine `auto` forks 15 workers that each preallocate their whole
# connection table and occupy 212 MiB of a 256 MiB container before a single request
# arrives. Two workers match the two CPUs the compose file grants this container, and the
# memory limit there is derived from the connection budget set below.
worker_processes 2;
worker_rlimit_nofile 65536;

# The unprivileged image runs as uid 101 on a read-only root filesystem, so every
# path nginx writes to has to live under the /tmp tmpfs.
pid /tmp/nginx.pid;

error_log /var/log/nginx/error.log warn;

events {
    # Per worker, and a proxied websocket occupies two slots (one towards the browser,
    # one towards the upstream), so the pair of workers admits 32768 simultaneous proxied
    # sockets. A live proxied websocket was measured at ~32 KiB of container memory for
    # the pair, which is what the nginx memory limit in docker-compose.yml is sized from.
    worker_connections 32768;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    log_format json escape=json
        '{"time":"$time_iso8601","remote_addr":"$remote_addr","method":"$request_method",'
        '"uri":"$uri","status":$status,"bytes":$body_bytes_sent,'
        '"request_time":$request_time,"upstream_time":"$upstream_response_time",'
        '"upstream":"$upstream_addr","referrer":"$http_referer","user_agent":"$http_user_agent"}';
    access_log /var/log/nginx/access.log json;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65s;
    keepalive_requests 10000;
    reset_timedout_connection on;

    # Ingest batches are capped at 1000 reports by the API; anything larger is a mistake
    # and should be rejected at the edge rather than buffered to disk.
    client_max_body_size 2m;
    client_body_buffer_size 256k;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript application/json
               application/geo+json image/svg+xml;

    # Docker's embedded DNS, so `server api:8000 resolve` picks up replicas that appear
    # after nginx started (`docker compose up --scale api=4`) without a reload.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 3s;

    upstream api {
        zone api 1m;
        server api:8000 resolve;
        keepalive 64;
        keepalive_timeout 60s;
        keepalive_requests 10000;
    }

    # The load generator runs inside the stack and legitimately drives thousands of
    # requests per second from a single address, so it is exempt: an empty key switches
    # limit_req off for that source. The exemption names the backend subnet that
    # docker-compose.yml pins and nothing else, and it carves the gateway address back
    # out again, because that is the address traffic published to the host is translated
    # from - every browser, device and password guesser arrives that way and must stay
    # limited.
    geo $rate_limited_source {
        default       1;
        10.83.0.0/24  0;
        10.83.0.1/32  1;
    }
    map $rate_limited_source $rate_limit_key {
        0 "";
        1 $binary_remote_addr;
    }

    limit_req_zone $rate_limit_key zone=login:1m   rate=10r/s;
    limit_req_zone $rate_limit_key zone=ingest:10m rate=2000r/s;
    limit_req_status 429;

    # A dashboard websocket is held for as long as a tab stays open and costs two
    # connection slots, so a client opening them in a loop would exhaust the table long
    # before the gateway's per-user session cap ever sees a handshake - that cap only
    # counts sessions that finished one. The ceiling below is generous for people (a
    # browser opens one socket per tab, and the gateway allows 20 sessions per user) and
    # fatal to a flood. The device endpoint is deliberately left out of it: a fleet
    # reaches the proxy from one gateway address by design, so a per-address ceiling
    # there would cap the fleet rather than an attacker.
    limit_conn_zone $rate_limit_key zone=ws_conn:10m;
    limit_conn_status 429;

    server {
        # reuseport gives every worker its own accept queue, so the kernel spreads
        # connections evenly. Without it one worker wins nearly every accept and runs out
        # of worker_connections while its sibling idles: measured at 20k websockets,
        # 386 MiB in one worker against 26 MiB in the other, and
        # "32768 worker_connections are not enough" in the error log from 16k sockets on.
        listen 8080 default_server reuseport backlog=4096;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;
        charset utf-8;

        # Liveness of the proxy itself: answered locally so it stays meaningful while
        # the API tier is being redeployed.
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Prometheus scrapes the replicas directly over the backend network; the edge
        # never exposes internal counters.
        location = /metrics {
            deny all;
        }

        location = /api/v1/auth/login {
            limit_req zone=login burst=20 nodelay;
            include /etc/nginx/snippets/proxy.conf;
            proxy_pass http://api;
        }

        location = /api/v1/ingest/locations {
            limit_req zone=ingest burst=4000 nodelay;
            include /etc/nginx/snippets/proxy.conf;
            proxy_pass http://api;
        }

        location /api/ {
            include /etc/nginx/snippets/proxy.conf;
            proxy_pass http://api;
        }

        location /health/ {
            include /etc/nginx/snippets/proxy.conf;
            proxy_pass http://api;
        }

        location = /openapi.json {
            include /etc/nginx/snippets/proxy.conf;
            proxy_pass http://api;
        }

        location /docs {
            include /etc/nginx/snippets/proxy.conf;
            proxy_pass http://api;
        }

        location = /ws {
            limit_conn ws_conn 512;
            include /etc/nginx/snippets/proxy.conf;
            include /etc/nginx/snippets/websocket.conf;
            proxy_pass http://api;
        }

        # No limit_conn here: this is where the fleet arrives, and the load generator
        # opening one socket per device is the behaviour the stack exists to carry.
        location = /ws/ingest {
            include /etc/nginx/snippets/proxy.conf;
            include /etc/nginx/snippets/websocket.conf;
            proxy_pass http://api;
        }

        # A year of immutable caching is only safe for a file whose name changes when its
        # contents do, so the rule is keyed on the fingerprint rather than on the
        # directory: an unhashed /assets/app.css picks up the short-lived policy at the
        # bottom instead of being pinned in every visitor's cache until they clear it.
        location ~ "^/assets/.+\.[0-9a-f]{8,}\.[A-Za-z0-9]+$" {
            include /etc/nginx/snippets/security-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            access_log off;
            try_files $uri =404;
        }

        # The entry document must never be cached, or a redeploy strands clients on
        # the previous bundle.
        location = / {
            include /etc/nginx/snippets/security-headers.conf;
            add_header Cache-Control "no-store" always;
            try_files /index.html =404;
        }

        location = /index.html {
            include /etc/nginx/snippets/security-headers.conf;
            add_header Cache-Control "no-store" always;
        }

        location / {
            include /etc/nginx/snippets/security-headers.conf;
            add_header Cache-Control "public, max-age=300" always;
            try_files $uri $uri/ =404;
        }
    }
}
