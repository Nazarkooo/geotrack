# Applied to everything served from the document root. The map libraries and their
# styles come from jsDelivr, basemap tiles and glyphs from OpenFreeMap, and MapLibre
# starts its worker from a blob URL.
#
# The sha256 is the dashboard's inline import map, which is the only way to give the
# drawing plugin a bare "maplibre-gl" specifier to resolve - an import map cannot be
# loaded from a file. Editing anything between that element's tags changes the digest and
# the page stops loading, so the test suite recomputes it from frontend/index.html and
# compares it against what this file serves.
#
# Two of the sources below are easy to get wrong and both fail as a map that never
# finishes loading rather than as an obvious error: MapLibre's worker starts from a blob
# but fetches its shared chunk from the CDN, so worker-src needs that origin as well as
# blob:, and the basemap resolves some of its own resources through data: URLs, which
# connect-src has to allow as well as img-src.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net 'sha256-9s4IzXwByyH/7H46zg0tAs1zhty95JSAFu446P2KI6c='; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: blob: https://tiles.openfreemap.org; connect-src 'self' data: https://tiles.openfreemap.org; worker-src blob: https://cdn.jsdelivr.net; font-src 'self' https://tiles.openfreemap.org; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
