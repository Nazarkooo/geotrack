# Shared proxy settings for every API location.
#
# nginx 1.30 proxies over HTTP/1.1 with upstream keepalive enabled and sends no
# Connection header of its own, so these locations deliberately set neither: adding
# `Connection: close` here would throw away the keepalive pool on every request.
#
# Read and send timeouts are left at nginx's 60s default so that the websocket
# snippet can raise them without colliding with a value set twice at the same level.
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;

# Overwritten, never appended to. There is no proxy in front of this one, so the peer
# nginx accepted the connection from is the client, and $proxy_add_x_forwarded_for would
# prepend whatever the caller put in the header - the application reads the leftmost
# entry, so one request header would be enough to forge the address in every audit log
# line and per-IP decision downstream. The RFC 7239 header is dropped for the same
# reason: nothing in the stack sets it, so anything arriving in it is someone else's.
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header Forwarded         "";

proxy_connect_timeout 5s;

# 503 is how the API reports backpressure; retrying it on a sibling replica would
# only move the same overloaded queue around. `non_idempotent` stays off, so a POST
# that timed out mid-flight is never replayed and a report cannot be ingested twice.
proxy_next_upstream error timeout;
proxy_next_upstream_tries 2;

proxy_redirect off;
