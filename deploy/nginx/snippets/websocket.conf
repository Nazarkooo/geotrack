# Websocket locations are the only ones that negotiate an upgrade, so they are the
# only ones that may send a Connection header.
proxy_http_version 1.1;
proxy_set_header Upgrade    $http_upgrade;
proxy_set_header Connection "upgrade";

# A dashboard stays connected for as long as the tab is open; the gateway keeps the
# link alive with its own ping/stats frames.
proxy_read_timeout 3600s;
proxy_send_timeout 3600s;

# Frames must reach the browser as they are produced, not when a buffer fills up.
proxy_buffering off;
