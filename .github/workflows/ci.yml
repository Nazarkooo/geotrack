name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.15"

jobs:
  quality:
    name: lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - run: uv sync --locked

      - run: uv run ruff check --output-format=github .

      - run: uv run ruff format --check .

      - run: uv run mypy

  tests:
    name: test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - run: scripts/bootstrap-env.sh

      # The same PostGIS image the stack runs, so the suite never tests against a
      # different PostgreSQL or PostGIS build than production does.
      - name: Start PostgreSQL and Redis
        run: docker compose -f docker-compose.yml -f compose.ci.yml up -d --wait postgres redis

      - name: Export the connection strings
        run: |
          set -a
          source .env
          set +a
          echo "::add-mask::$POSTGRES_PASSWORD"
          echo "::add-mask::$REDIS_PASSWORD"
          echo "TEST_DATABASE_URL=postgresql+asyncpg://$POSTGRES_USER:$POSTGRES_PASSWORD@127.0.0.1:5432/$POSTGRES_DB" >> "$GITHUB_ENV"
          echo "TEST_REDIS_URL=redis://:$REDIS_PASSWORD@127.0.0.1:6379/0" >> "$GITHUB_ENV"

      - run: uv sync --locked

      # The gate is the point of measuring: an artifact nobody opens does not keep the
      # spatial and messaging code covered.
      - run: uv run pytest -q --cov --cov-report=xml --cov-report=term --cov-fail-under=85

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: warn

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f compose.ci.yml down -v

  stack:
    name: stack boots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - run: scripts/bootstrap-env.sh

      - run: docker compose build

      # --wait only returns once every healthcheck passes, so this alone proves the
      # migration ran and both tiers came up against real PostGIS and Redis. The
      # monitoring profile is included because Prometheus and Grafana are part of the
      # deliverable and their provisioning fails silently otherwise.
      - name: Start the whole stack
        run: docker compose --profile monitoring up -d --wait

      - run: uv sync --locked

      - name: Smoke test
        run: scripts/smoke.sh

      # Prometheus only reports a target as up once it has actually scraped it, so this
      # proves DNS-based replica discovery and the /metrics endpoints together.
      - name: Check that Prometheus is scraping every tier
        run: scripts/check-monitoring.sh

      - name: Dump logs
        if: failure()
        run: docker compose --profile monitoring logs --no-color --tail=200

      - name: Tear down
        if: always()
        run: docker compose --profile monitoring --profile loadtest down -v
