name: geotrack

x-app-image: &app-image
  build:
    context: .
    dockerfile: Dockerfile
  image: geotrack-app:latest

x-app-environment: &app-environment
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?set POSTGRES_USER}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB}
  REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379/0
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
  INGEST_API_KEY: ${INGEST_API_KEY:?set INGEST_API_KEY}
  INGEST_SHARDS: ${INGEST_SHARDS:-8}
  INGEST_MAX_BATCH: ${INGEST_MAX_BATCH:-1000}
  INGEST_BACKLOG_HIGH: ${INGEST_BACKLOG_HIGH:-200000}
  INGEST_BACKLOG_LOW: ${INGEST_BACKLOG_LOW:-100000}
  INGEST_MAX_FUTURE_SKEW_S: ${INGEST_MAX_FUTURE_SKEW_S:-300}
  HISTORY_RETENTION_DAYS: ${HISTORY_RETENTION_DAYS:-7}
  DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
  DB_POOL_TIMEOUT_S: ${DB_POOL_TIMEOUT_S:-5}
  DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS:-5000}
  PROCESSOR_BATCH_SIZE: ${PROCESSOR_BATCH_SIZE:-1000}
  PROCESSOR_BLOCK_MS: ${PROCESSOR_BLOCK_MS:-1000}
  PROCESSOR_LEASE_TTL_MS: ${PROCESSOR_LEASE_TTL_MS:-15000}
  PROCESSOR_HTTP_PORT: ${PROCESSOR_HTTP_PORT:-9100}
  WS_TICK_MS: ${WS_TICK_MS:-250}
  WS_CONTROL_QUEUE_MAX: ${WS_CONTROL_QUEUE_MAX:-1000}
  WS_SEND_TIMEOUT_S: ${WS_SEND_TIMEOUT_S:-10}
  WS_DEVICE_STALE_S: ${WS_DEVICE_STALE_S:-300}
  WS_GRID_CELL_DEG: ${WS_GRID_CELL_DEG:-0.05}
  WS_MAX_SESSIONS_PER_USER: ${WS_MAX_SESSIONS_PER_USER:-20}
  GEOZONE_QUOTA_PER_USER: ${GEOZONE_QUOTA_PER_USER:-500}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_FORMAT: ${LOG_FORMAT:-json}

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

# Nothing in this stack needs to write to its image or to raise privileges.
x-hardening: &hardening
  read_only: true
  tmpfs:
    - /tmp:size=64m
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  init: true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  postgres:
    build:
      context: ./deploy/postgres
    image: geotrack-postgis:18-3.6
    # The entrypoint would otherwise start as root and step down with gosu; pinning the
    # uid means no process in this container is ever privileged. The image already owns
    # /var/lib/postgresql as 999:999, so a fresh volume initialises cleanly.
    user: "999:999"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=512MB
      - -c
      - work_mem=16MB
      - -c
      - max_wal_size=2GB
      - -c
      - checkpoint_completion_target=0.9
    volumes:
      # PostgreSQL 18 images keep PGDATA under /var/lib/postgresql/18/docker.
      - postgres-data:/var/lib/postgresql
    shm_size: 256m
    tmpfs:
      # The unix socket directory is recreated on every start and must belong to the
      # server's uid; keeping it in memory also keeps a stale socket from surviving.
      - /var/run/postgresql:uid=999,gid=999,mode=0755
    # The data directory has to stay writable, so this container is hardened without a
    # read-only root.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # Forced over TCP: during initdb a socket-only server would answer "ready" early.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g
    <<: *logging
    networks: [backend]
    restart: unless-stopped

  redis:
    image: redis:8.10.1-alpine
    # Without an explicit uid the entrypoint cannot step down from root once the
    # capabilities are gone, and the server keeps running privileged.
    user: "999:999"
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD}
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      # Half the container limit. An AOF rewrite forks, and copy-on-write on a hot
      # dataset can approach a second copy of it before the child finishes, so a
      # maxmemory equal to the cgroup limit gets the process holding every un-acked
      # ingest entry OOM-killed exactly when the write load is heaviest. Still two
      # orders of magnitude above the backpressure watermark the streams are allowed
      # to reach (INGEST_BACKLOG_HIGH entries).
      - --maxmemory
      - 640mb
      # Streams hold work that has not been committed yet: refuse writes rather than
      # evict a key and lose reports silently.
      - --maxmemory-policy
      - noeviction
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 1280m
    <<: *hardening
    networks: [backend]
    restart: unless-stopped

  migrate:
    <<: [*app-image, *hardening]
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *app-environment
      SERVICE_NAME: geotrack-migrate
    depends_on:
      postgres:
        condition: service_healthy
    # One-shot container: it exits, so the image's healthcheck would only ever report
    # a dead container to `compose up --wait`.
    healthcheck:
      disable: true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m
    networks: [backend]
    restart: "no"

  api:
    <<: [*app-image, *hardening]
    # Long enough for uvicorn's own graceful shutdown of open websockets.
    stop_grace_period: 25s
    environment:
      <<: *app-environment
      SERVICE_NAME: geotrack-api
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import sys,urllib.request as u; sys.exit(0 if u.urlopen('http://127.0.0.1:8000/health/live', timeout=2).status == 200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    deploy:
      # Stateless: sessions live in Redis and every replica can serve any of them.
      replicas: 2
      resources:
        limits:
          cpus: "1.0"
          memory: 768m
    networks: [backend]
    restart: unless-stopped

  processor:
    <<: [*app-image, *hardening]
    command: ["python", "-m", "geotrack.processor"]
    # Shutdown finishes the in-flight batch and hands the leases back; measured at ~8 s
    # in the worst case, which the 10 s default would cut short.
    stop_grace_period: 25s
    environment:
      <<: *app-environment
      SERVICE_NAME: geotrack-processor
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import sys,urllib.request as u; sys.exit(0 if u.urlopen('http://127.0.0.1:${PROCESSOR_HTTP_PORT:-9100}/health/live', timeout=2).status == 200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    deploy:
      # Shards are leased, so replicas split the streams between them and a lost
      # replica's shards are picked up by the survivors.
      replicas: 2
      resources:
        limits:
          cpus: "1.0"
          memory: 768m
    networks: [backend]
    restart: unless-stopped

  nginx:
    image: nginxinc/nginx-unprivileged:1.30.5-alpine
    <<: [*hardening]
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/snippets:/etc/nginx/snippets:ro
      - ./frontend:/usr/share/nginx/html:ro
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    deploy:
      resources:
        limits:
          # Two CPUs for the two workers nginx.conf pins. The memory limit is the
          # connection budget priced out: a live proxied websocket costs ~32 KiB of
          # container memory (nginx keeps a request pool, a header buffer and a relay
          # buffer per side, and the kernel keeps socket structures for both), so the two
          # workers' 65536 slots need ~1.05 GiB at saturation and 20k sockets were
          # measured at 664 MiB. Sizing this from the CPU count instead is what let the
          # old configuration OOM-kill its workers while still reporting healthy.
          cpus: "2.0"
          memory: 1280m
    networks: [backend, edge]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.13.3
    <<: [*hardening]
    profiles: [monitoring]
    user: "65534:65534"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-6h}
      - --web.listen-address=0.0.0.0:9090
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/healthy"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m
    networks: [backend]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.2
    <<: [*hardening]
    profiles: [monitoring]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      # Grafana 13 tries to update its bundled plugins on every start: it unregisters
      # the shipped Prometheus plugin, fails to rewrite it on a read-only root and
      # leaves every panel reporting "plugin not registered". The image already
      # contains the plugins this dashboard needs.
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m
    networks: [backend, edge]
    restart: unless-stopped

  generator:
    <<: [*app-image, *hardening]
    profiles: [loadtest]
    command: ["python", "generator.py"]
    # The names on the left are the environment fallbacks generator.py reads; the
    # GENERATOR_* names on the right are what .env.example calls them, so a load run is
    # retuned from one file with no command line.
    #
    # This service drives the batching transport: 10,000 devices reporting every five
    # seconds, micro-batched 250 at a time over a pool of 32 connections, which is how a
    # device gateway forwards a fleet. The socket-per-device mode - 10,000 simultaneous
    # websockets, one schedule each - is the same image with one flag:
    #   docker compose --profile loadtest run --rm generator \
    #     python generator.py --transport ws
    environment:
      SERVICE_NAME: geotrack-generator
      INGEST_API_KEY: ${INGEST_API_KEY:?set INGEST_API_KEY}
      GEOTRACK_URL: ${GENERATOR_BASE_URL:-http://nginx:8080}
      TRANSPORT: http
      DEVICES: ${GENERATOR_DEVICES:-10000}
      INTERVAL: ${GENERATOR_INTERVAL_S:-5}
      BATCH_SIZE: ${GENERATOR_BATCH_SIZE:-250}
      CONNECTIONS: ${GENERATOR_CONCURRENCY:-32}
      DURATION: ${GENERATOR_DURATION_S:-0}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-json}
    volumes:
      # Mounted instead of baked into the image so a load run can be retuned without
      # rebuilding, and so the application image stays free of test tooling.
      - ./generator.py:/app/generator.py:ro
    depends_on:
      nginx:
        condition: service_healthy
    healthcheck:
      disable: true
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    sysctls:
      # 10k devices on one host burn through the default ephemeral range.
      net.ipv4.ip_local_port_range: "1024 65000"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1g
    networks: [backend]
    restart: "no"

networks:
  # Nothing on the backend can reach or be reached from outside the stack; the proxy
  # and Grafana straddle both networks because they are the only entry points.
  #
  # The subnets are pinned rather than drawn from Docker's pool because the proxy's rate
  # limiting keys off them: the load generator runs on `backend` and must not be
  # throttled, while everything published to the host is translated from a gateway
  # address and must be. Addresses outside Docker's default pools (172.17.0.0/12 and
  # 192.168.0.0/16) so a stack started next to this one cannot collide.
  backend:
    internal: true
    ipam:
      config:
        - subnet: 10.83.0.0/24
  edge:
    ipam:
      config:
        - subnet: 10.83.1.0/24

volumes:
  postgres-data:
  redis-data:
  prometheus-data:
  grafana-data:
